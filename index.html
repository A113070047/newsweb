<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的公視新聞聚合平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .news-card { transition: transform 0.3s ease, box-shadow 0.3s ease; border-radius: 12px; overflow: hidden; border: none;}
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 200px; object-fit: cover; background-color: #e9ecef; }
        .search-box { box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-radius: 30px; overflow: hidden; }
        .search-box input { border: none; padding: 15px 25px; outline: none; box-shadow: none; }
        .search-box input:focus { box-shadow: none; }
        
        /* 分類按鈕的樣式微調 */
        .category-btn { border-radius: 20px; padding: 8px 20px; font-weight: 500; transition: all 0.2s; }
        .category-btn.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-4">
            <h1 class="display-4 fw-bold text-primary">公視新聞聚合平台</h1>
            <p class="lead text-muted">全自動抓取 × 智能分類</p>
        </header>
        
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <div class="input-group input-group-lg search-box bg-white">
                    <span class="input-group-text bg-white border-0 text-muted px-4">🔍</span>
                    <input type="text" id="searchInput" class="form-control" placeholder="輸入關鍵字搜尋新聞...">
                </div>
            </div>
        </div>

        <div class="row justify-content-center mb-5">
            <div class="col-md-10 text-center" id="category-buttons">
                </div>
        </div>

        <div id="news-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="text-center w-100"><div class="spinner-border text-primary" role="status"></div><p>新聞載入中...</p></div>
        </div>
    </div>

    <script>
        let allNewsData = []; 
        let currentCategory = '全部'; // 記錄目前選擇的分類

        // 畫出新聞卡片的函式
        function renderNews(newsArray) {
            const container = document.getElementById('news-container');
            container.innerHTML = ''; 
            
            if (newsArray.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <h4 class="text-muted">找不到符合條件的新聞 😢</h4>
                    </div>`;
                return;
            }
            
            newsArray.forEach(item => {
                const imgHtml = (item.image_url && item.image_url.startsWith('http')) 
                    ? `<img src="${item.image_url}" class="card-img-top" alt="新聞縮圖">`
                    : `<div class="card-img-top d-flex align-items-center justify-content-center text-muted"><span>📷 暫無新聞縮圖</span></div>`;
                
                // 【修改】：將寫死的「焦點新聞」改成動態讀取 item.category，如果沒抓到就顯示「其他」
                const categoryBadge = item.category ? item.category : '其他';
                    
                const card = `
                    <div class="col">
                        <div class="card h-100 news-card shadow-sm">
                            ${imgHtml}
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-info text-dark mb-2 align-self-start">${categoryBadge}</span>
                                <h5 class="card-title fw-bold text-dark mb-3">${item.title}</h5>
                                <p class="card-text text-muted flex-grow-1" style="font-size: 0.95rem; line-height: 1.6;">${item.content_preview}</p>
                                <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                                    <small class="text-muted">🕒 ${item.date}</small>
                                    <a href="${item.link}" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill px-3">閱讀原文</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 產生分類按鈕的函式
        function renderCategoryButtons() {
            // 從所有新聞中，把出現過的分類統整出來，並加上「全部」
            const categories = ['全部', '政治', '科技', '氣象', '財經', '體育', '其他'];
            const btnContainer = document.getElementById('category-buttons');
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `btn btn-outline-primary mx-1 mb-2 category-btn ${cat === '全部' ? 'active' : ''}`;
                btn.textContent = cat;
                
                // 點擊按鈕時的事件
                btn.onclick = () => {
                    // 移除所有按鈕的 active 狀態
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    // 替當前點擊的按鈕加上 active
                    btn.classList.add('active');
                    // 更新當前分類
                    currentCategory = cat;
                    // 觸發篩選
                    filterNews();
                };
                
                btnContainer.appendChild(btn);
            });
        }

        // 【核心邏輯】：同時處理「關鍵字搜尋」和「分類點擊」的篩選器
        function filterNews() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filteredNews = allNewsData.filter(item => {
                // 1. 檢查分類是否符合 (如果選'全部'就一律通過)
                const itemCat = item.category || '其他';
                const matchCategory = (currentCategory === '全部') || (itemCat === currentCategory);
                
                // 2. 檢查關鍵字是否符合
                const matchTitle = item.title && item.title.toLowerCase().includes(keyword);
                const matchContent = item.content_preview && item.content_preview.toLowerCase().includes(keyword);
                const matchKeyword = keyword === '' || matchTitle || matchContent;
                
                // 必須同時符合分類和關鍵字才顯示
                return matchCategory && matchKeyword;
            });
            
            renderNews(filteredNews);
        }

        // 初始讀取 JSON
        fetch('news_data.json')
            .then(response => response.json())
            .then(data => {
                allNewsData = data; 
                renderCategoryButtons(); // 畫出分類按鈕
                renderNews(allNewsData); // 畫出所有新聞
            })
            .catch(error => console.error('讀取新聞失敗:', error));

        // 監聽搜尋框輸入事件
        document.getElementById('searchInput').addEventListener('input', filterNews);
    </script>
</body>
</html>
