name: Auto News Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4  # 更新到 v4，消除黃色警告
        
      - name: Setup Python
        uses: actions/setup-python@v5 # 更新到 v5，消除黃色警告
        with:
          python-version: "3.10"
          
      - name: 檢查檔案列表 (除錯用)
        run: ls -la
          
      - name: Install Requirements
        run: pip install requests beautifulsoup4 newspaper3k lxml_html_clean
        
      - name: Run Scraper
        run: python news_scraper.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          git commit -m "🤖 自動更新新聞資料庫" || exit 0
          git push
