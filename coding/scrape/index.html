<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 AI 自動新聞聚合平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .news-card { transition: transform 0.3s ease, box-shadow 0.3s ease; border-radius: 12px; overflow: hidden; border: none;}
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 200px; object-fit: cover; background-color: #e9ecef; }
        /* 讓搜尋框更有質感 */
        .search-box { box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-radius: 30px; overflow: hidden; }
        .search-box input { border: none; padding: 15px 25px; outline: none; box-shadow: none; }
        .search-box input:focus { box-shadow: none; }
    </style>
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-4">
            <h1 class="display-4 fw-bold text-primary">公視新聞聚合平台</h1>
            <p class="lead text-muted">GitHub Actions 全自動更新版本</p>
        </header>
        
        <!-- 【新增】：搜尋引擎輸入框 -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <div class="input-group input-group-lg search-box bg-white">
                    <span class="input-group-text bg-white border-0 text-muted px-4">🔍</span>
                    <input type="text" id="searchInput" class="form-control" placeholder="輸入關鍵字搜尋新聞（例如：天氣、政策）...">
                </div>
            </div>
        </div>

        <!-- 這裡預留一個空的 div，讓 JavaScript 把新聞塞進來 -->
        <div id="news-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="text-center w-100"><div class="spinner-border text-primary" role="status"></div><p>新聞載入中...</p></div>
        </div>
    </div>

    <script>
        // 【新增】：建立一個全域變數，用來把「所有新聞」先記在瀏覽器的記憶體裡
        let allNewsData = []; 

        // 【新增】：將「畫出新聞卡片」的動作獨立成一個函式，方便重複呼叫
        function renderNews(newsArray) {
            const container = document.getElementById('news-container');
            container.innerHTML = ''; // 先清空目前畫面
            
            // 如果搜尋後沒有任何結果，顯示提示訊息
            if (newsArray.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <h4 class="text-muted">找不到符合關鍵字的新聞 😢</h4>
                        <p class="text-muted">請嘗試使用其他關鍵字搜尋</p>
                    </div>`;
                return;
            }
            
            // 迴圈畫出每一張新聞卡片
            newsArray.forEach(item => {
                const imgHtml = (item.image_url && item.image_url.startsWith('http')) 
                    ? `<img src="${item.image_url}" class="card-img-top" alt="新聞縮圖">`
                    : `<div class="card-img-top d-flex align-items-center justify-content-center text-muted"><span>📷 暫無新聞縮圖</span></div>`;
                    
                const card = `
                    <div class="col">
                        <div class="card h-100 news-card shadow-sm">
                            ${imgHtml}
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-primary mb-2 align-self-start">焦點新聞</span>
                                <h5 class="card-title fw-bold text-dark mb-3">${item.title}</h5>
                                <p class="card-text text-muted flex-grow-1" style="font-size: 0.95rem; line-height: 1.6;">${item.content_preview}</p>
                                <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                                    <small class="text-muted">🕒 ${item.date}</small>
                                    <a href="${item.link}" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill px-3">閱讀原文</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 第一步：一進網頁，去讀取 JSON 檔案
        fetch('news_data.json')
            .then(response => response.json())
            .then(data => {
                allNewsData = data; // 把抓到的資料存進剛剛宣告的變數裡
                renderNews(allNewsData); // 第一次先顯示「全部」的新聞
            })
            .catch(error => console.error('讀取新聞失敗:', error));

        // 【新增】：第二步：監聽使用者的「打字」動作 (即時搜尋核心)
        document.getElementById('searchInput').addEventListener('input', function(event) {
            // 抓出使用者正在輸入的文字，並轉成小寫 (方便比對英文)
            const keyword = event.target.value.toLowerCase().trim();
            
            // 利用陣列的 filter 功能，篩選出符合條件的新聞
            const filteredNews = allNewsData.filter(item => {
                // 條件：只要「標題」或「內文預覽」裡面有包含關鍵字，就保留下來
                const matchTitle = item.title && item.title.toLowerCase().includes(keyword);
                const matchContent = item.content_preview && item.content_preview.toLowerCase().includes(keyword);
                
                return matchTitle || matchContent;
            });
            
            // 把篩選過的新聞清單，重新丟給渲染函式去畫出來
            renderNews(filteredNews);
        });
    </script>
</body>
</html>
